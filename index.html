<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Página de inicio</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="container">

        <header class="header">

            <div id="clock" class="clock">
                --:--
            </div>

            <div id="date" class="date">
                Cargando fecha...
            </div>

        </header>


        <!-- Buscador de Brave -->
        <div class="web-search-container">
            <img
                class="web-search-icon"
                src="img/brave-icon.webp"
                alt="Brave"
            >
            <input
                type="search"
                id="web-search"
                placeholder="Buscar en Brave..."
                autocomplete="off"
            >
        </div>

        <div class="links-title">
            <span>Mis enlaces</span>
        </div>

        <!-- Buscador de enlaces -->
        <div class="search-container">
            <img class="search-icon" src="img/lupa.webp" alt="">
            <input
                type="search"
                id="search"
                placeholder="Buscar enlaces..."
                autocomplete="off"
            >
        </div>


        <section id="categories" class="categories">
            <!-- Las categorías se cargarán desde links.json -->
        </section>

    </main>

    <script src="js/app.js"></script>
</body>
</html>
